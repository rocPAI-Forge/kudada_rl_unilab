# @package _global_
# Crouch-walk: lower the CoM through knee flexion rather than hip abduction.
# Base-height reward alone is gamed by spreading the legs, so the crouch target
# is enforced on the joints and the stance width is capped. The wider action
# scale is required because the knee cannot reach the crouch target at 0.5.
defaults:
  - /task/walk-flat/mujoco
  - _self_

training:
  task_name: KudadaCrouchWalk

env:
  actions:
    joint_pos:
      scale: 0.8
  observations:
    policy:
      terms:
        height_command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: height}
    critic:
      terms:
        height_command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: height}
  commands:
    twist:
      rel_standing_envs: 0.0
      ranges:
        lin_vel_x: [0.2, 0.5]
        lin_vel_y: [-0.2, 0.2]
        ang_vel_z: [-0.5, 0.5]
    height:
      _target_: kudada_rl_unilab.tasks.kudada.manager_terms.HeightCommandCfg
      resampling_time_range: [10.0, 10.0]
      ranges: [0.18, 0.23]
  terminations:
    base_height:
      func: unilab.envs.mdp.root_height_below_minimum
      params: {minimum_height: 0.12}

reward:
  tracking_height:
    func: kudada_rl_unilab.tasks.kudada.manager_terms.track_base_height
    weight: 10.0
    params:
      command_name: height
      tracking_sigma: 0.003
  penalty_height_error:
    func: kudada_rl_unilab.tasks.kudada.manager_terms.penalty_base_height_error
    weight: -80.0
    params: {command_name: height}
  track_crouch_pose:
    func: kudada_rl_unilab.tasks.kudada.manager_terms.track_crouch_pose
    weight: 6.0
    params:
      joint_targets: [0.0, 0.0, -0.8, 1.35, -0.55, 0.0, 0.0, -0.8, 1.35, -0.55]
      tracking_sigma: 0.5
  penalty_crouch_pose:
    func: kudada_rl_unilab.tasks.kudada.manager_terms.penalty_crouch_pose_error
    weight: -12.0
    params:
      joint_targets: [0.0, 0.0, -0.8, 1.35, -0.55, 0.0, 0.0, -0.8, 1.35, -0.55]
      joint_weights: [1.0, 10.0, 3.0, 3.0, 2.0, 1.0, 10.0, 3.0, 3.0, 2.0]
  penalty_wide_feet:
    func: kudada_rl_unilab.tasks.kudada.manager_terms.penalty_wide_feet_xy
    weight: -80.0
    params: {max_width: 0.28}
  pose:
    weight: -0.3
    params:
      pose_weights: [5.0, 5.0, 1.0, 2.0, 5.0, 5.0, 5.0, 1.0, 2.0, 5.0]
