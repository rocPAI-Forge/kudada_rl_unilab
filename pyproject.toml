[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project]
name = "roscon-rl-unilab"
version = "0.1.0"
description = "Tinker Lingzu 10-DoF walk-flat FastSAC training on UniLab and MuJoCo"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
dependencies = [
  "unilab[mujoco]==1.3.0",
]

[project.optional-dependencies]
rocm = [
  "amdsmi; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torch==2.11.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "triton-rocm==3.6.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
roscon-train = "roscon_rl_unilab.cli:train_main"
roscon-eval = "roscon_rl_unilab.cli:eval_main"

[project.entry-points."unilab.tasks"]
roscon = "roscon_rl_unilab.tasks"

[dependency-groups]
dev = ["pytest>=8.0"]

[[tool.uv.index]]
name = "pytorch-rocm72"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-rocm72", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'", extra = "rocm" },
]
triton-rocm = [
  { index = "pytorch-rocm72", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[tool.uv]
no-build-isolation-package = ["mujoco-uni-runtime"]
no-binary-package = ["mujoco-uni-runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: real backend construction or training smoke"]
addopts = "--tb=short -m 'not slow'"
