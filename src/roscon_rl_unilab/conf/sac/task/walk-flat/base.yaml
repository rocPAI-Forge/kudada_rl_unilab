# @package _global_
# Tinker Lingzu 10-DoF command-conditioned flat-ground walking task.
env:
  scene:
    model_file: assets/robots/tinker_lingzu/mjcf/scene_flat.xml
    default_keyframe_name: home
    entities:
      robot:
        root_body_name: base_link
        joint_names:
          - left_leg_hip_yaw_joint
          - left_leg_hip_roll_joint
          - left_leg_hip_pitch_joint
          - left_leg_knee_pitch_joint
          - left_leg_ankle_pitch_joint
          - right_leg_hip_yaw_joint
          - right_leg_hip_roll_joint
          - right_leg_hip_pitch_joint
          - right_leg_knee_pitch_joint
          - right_leg_ankle_pitch_joint
        actuator_names:
          - left_leg_hip_yaw_joint
          - left_leg_hip_roll_joint
          - left_leg_hip_pitch_joint
          - left_leg_knee_pitch_joint
          - left_leg_ankle_pitch_joint
          - right_leg_hip_yaw_joint
          - right_leg_hip_roll_joint
          - right_leg_hip_pitch_joint
          - right_leg_knee_pitch_joint
          - right_leg_ankle_pitch_joint
        body_names: [base_link]
  sim_dt: 0.005
  ctrl_dt: 0.02
  max_episode_seconds: 20.0
  observations:
    policy:
      enable_corruption: true
      terms:
        base_ang_vel:
          func: unilab.envs.mdp.builtin_sensor
          params: {sensor_name: torso_gyro}
          scale: 0.25
        projected_gravity:
          func: unilab.envs.mdp.projected_gravity_from_sensor
          params: {sensor_name: torso_upvector}
        joint_pos:
          func: unilab.envs.mdp.joint_pos_rel
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.01
            n_max: 0.01
            operation: add
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
          scale: 0.05
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.1
            n_max: 0.1
            operation: add
        actions:
          func: unilab.envs.mdp.last_action
          params: {action_name: joint_pos}
        command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: twist}
        gait_phase:
          func: roscon_rl_unilab.tasks.tinker.manager_terms.TinkerGaitPhase
          params: {frequency: 1.0, init_mode: offset_phase}
    critic:
      terms:
        base_ang_vel:
          func: unilab.envs.mdp.builtin_sensor
          params: {sensor_name: torso_gyro}
          scale: 0.25
        projected_gravity:
          func: unilab.envs.mdp.projected_gravity_from_sensor
          params: {sensor_name: torso_upvector}
        joint_pos: {func: unilab.envs.mdp.joint_pos_rel}
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
          scale: 0.05
        actions:
          func: unilab.envs.mdp.last_action
          params: {action_name: joint_pos}
        command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: twist}
        gait_phase:
          func: roscon_rl_unilab.tasks.tinker.manager_terms.TinkerGaitPhase
          params: {frequency: 1.0, init_mode: offset_phase}
        base_lin_vel:
          func: unilab.envs.mdp.builtin_sensor
          params: {sensor_name: pelvis_local_linvel}
          scale: 2.0
  actions:
    joint_pos:
      _target_: unilab.envs.mdp.JointPositionActionCfg
      entity_name: robot
      actuator_names: [".*"]
      scale: 0.5
      use_default_offset: true
  commands:
    twist:
      _target_: roscon_rl_unilab.tasks.tinker.manager_terms.TinkerVelocityCommandCfg
      entity_name: robot
      resampling_time_range: [10.0, 10.0]
      heading_command: false
      heading_control_stiffness: 0.5
      rel_standing_envs: 0.2
      rel_heading_envs: 0.0
      rel_world_envs: 0.0
      rel_forward_envs: 0.0
      init_velocity_prob: 0.0
      planar_dead_zone: 0.0
      ranges:
        lin_vel_x: [-1.0, 1.0]
        lin_vel_y: [-1.0, 1.0]
        ang_vel_z: [-1.0, 1.0]
  events:
    reset_scene_to_default:
      func: unilab.envs.mdp.reset_scene_to_default
      mode: reset
    reset_root_state_uniform:
      func: unilab.envs.mdp.reset_root_state_uniform
      mode: reset
      params:
        pose_range:
          x: [0.0, 0.0]
          y: [0.0, 0.0]
          z: [0.0, 0.0]
          roll: [0.0, 0.0]
          pitch: [0.0, 0.0]
          yaw: [-3.141592653589793, 3.141592653589793]
        velocity_range:
          x: [-0.5, 0.5]
          y: [-0.5, 0.5]
          z: [-0.5, 0.5]
          roll: [-0.5, 0.5]
          pitch: [-0.5, 0.5]
          yaw: [-0.5, 0.5]
    pd_gains:
      func: unilab.envs.mdp.pd_gains
      mode: reset
      params:
        kp_range: [0.9, 1.1]
        kd_range: [0.9, 1.1]
        operation: scale
  terminations:
    time_out:
      func: unilab.envs.mdp.time_out
      time_out: true
    tilt:
      func: roscon_rl_unilab.tasks.tinker.manager_terms.tilt_exceeded
      params: {max_tilt_deg: 65.0}
    base_height:
      func: unilab.envs.mdp.root_height_below_minimum
      params: {minimum_height: 0.12}
  curriculum:
    penalty_scaling:
      func: roscon_rl_unilab.tasks.tinker.manager_terms.TinkerPenaltyCurriculum
      params:
        initial_scale: 0.5
        min_scale: 0.5
        max_scale: 1.0
        level_down_threshold: 150.0
        level_up_threshold: 750.0
        degree: 0.001
  policy_observation_group: policy
  critic_observation_group: critic

reward:
  tracking_lin_vel:
    func: unilab.tasks.locomotion.common.sensor_reward_terms.track_lin_vel
    weight: 4.0
    params:
      tracking_sigma: 0.25
      command_name: twist
      sensor_name: pelvis_local_linvel
  tracking_ang_vel:
    func: unilab.tasks.locomotion.common.sensor_reward_terms.track_ang_vel
    weight: 3.0
    params:
      tracking_sigma: 0.25
      command_name: twist
      sensor_name: torso_gyro
  penalty_ang_vel_xy:
    func: unilab.tasks.locomotion.common.sensor_reward_terms.ang_vel_xy
    weight: -1.0
    params: {sensor_name: torso_gyro}
  penalty_orientation:
    func: unilab.tasks.locomotion.common.sensor_reward_terms.orientation
    weight: -10.0
    params: {sensor_name: torso_upvector}
  penalty_action_rate:
    func: unilab.envs.mdp.action_rate_l2
    weight: -2.0
  pose:
    func: roscon_rl_unilab.tasks.tinker.manager_terms.weighted_pose
    weight: -0.5
    params:
      pose_weights: [5.0, 1.0, 0.01, 0.01, 5.0, 5.0, 1.0, 0.01, 0.01, 5.0]
  penalty_close_feet_xy:
    func: roscon_rl_unilab.tasks.tinker.manager_terms.penalty_close_feet_xy
    weight: -10.0
    params: {threshold: 0.15}
  penalty_feet_ori:
    func: roscon_rl_unilab.tasks.tinker.manager_terms.penalty_feet_ori
    weight: -5.0
  feet_phase:
    func: roscon_rl_unilab.tasks.tinker.manager_terms.feet_phase
    weight: 5.0
    params:
      frequency: 1.0
      swing_height: 0.05
      tracking_sigma: 0.008
      min_forward_speed: 0.15
      command_name: twist
  alive:
    func: unilab.tasks.locomotion.common.manager_terms.alive
    weight: 10.0
